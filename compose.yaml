services:
  aria-music:
    build:
      context: .
    image: aria-music:local
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${ARIA_PORT:-8787}:8787"
    dns:
      - "${CONTAINER_DNS_PRIMARY:-223.5.5.5}"
      - "${CONTAINER_DNS_SECONDARY:-119.29.29.29}"
    environment:
      AUTH_USERNAME: "${ARIA_USERNAME:-aria}"
      AUTH_PASSWORD: "${ARIA_PASSWORD:?请在 .env 中设置 ARIA_PASSWORD}"
      REQUIRE_AUTH: "1"
      SOURCE_ALLOWED_HOSTS: "${SOURCE_ALLOWED_HOSTS:-raw.githubusercontent.com,gh-proxy.org}"
      DEFAULT_SOURCES_ENABLED: "${DEFAULT_SOURCES_ENABLED:-1}"
      MEDIA_PROXY: "1"
      MEDIA_ALLOWED_HOSTS: "${MEDIA_ALLOWED_HOSTS:-}"
      ALLOW_PRIVATE_SOURCE_URLS: "${ALLOW_PRIVATE_SOURCE_URLS:-0}"
      DEBUG_ROUTING: "${DEBUG_ROUTING:-0}"
      DEBUG_HTTP: "${DEBUG_HTTP:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - aria-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m

volumes:
  aria-data:
